 if(rep&&(rep.reply==='accepted'||rep.reply==='declined')){const t=Number(rep.at);if(inTime(Number.isFinite(t)?t:0))return rep.reply}

// ───────── one round of the economy ─────────
// p: player {countryCode, stats, assets}; decision {alloc}; r: round; tctx: {net, dealTrade} from settled trades;
// seed/id give a deterministic "uncertainty" term (pass seed=null to switch it off).
function compute(p,decision,r,tctx,seed,id){

 const net=Number(tctx?.net)||0,dealTrade=Number(tctx?.dealTrade)||0,avail=Math.max(0,before.treasury+net);
 const alloc=cleanAlloc(decision?.alloc,avail),spent=sum(alloc);
 const z=()=>({growth:0,inflation:0,budget:0,happiness:0,trade:0}),now=z(),later=z();
 for(const A of AREAS){let m=P.mult[A.id]||1,u=units(alloc[A.id]||0)*m,d=stockUnits(assets[A.id]||0)*m;for(const [k,v] of Object.entries(A.now))now[k]+=v*u;for(const [k,v] of Object.entries(A.later))later[k]+=v*d}

 const unc=seed===null||seed===undefined?0:round((hash01(seed+'/'+r+'/'+id)-.5)*1.2);
 const next={...before};
 next.growth=round(clamp(P.potential+.4*(before.growth-P.potential)-.2*before.output+hit.growth+now.growth+later.growth+unc,-12,15));
 next.inflation=round(clamp(P.target+.6*(before.inflation-P.target)+hit.inflation+now.inflation+later.inflation,-4,25));
 next.budget=round(clamp(before.budget+hit.budget+now.budget+later.budget,0,100));
 next.happiness=round(clamp(before.happiness+hit.happiness+now.happiness+later.happiness+unc*.6,0,100));
 next.trade=round(clamp(before.trade+hit.trade+now.trade+later.trade+dealTrade,0,100));
 const newCredits=r<ROUNDS?ROUND_CREDITS:0;
 next.treasury=round(Math.max(0,avail-spent+newCredits));
 next.output=round2(before.output+(next.growth-P.potential));
 next.pricePain=round2(before.pricePain+excess(next.inflation,P));
 for(const [k,v] of Object.entries(alloc))assets[k]=(Number(assets[k])||0)+v;
 const change=Object.fromEntries(K.map(k=>[k,round(next[k]-before[k])]));
 const sb=score(before,code),sn=score(next,code);
 const left=round(avail-spent),note=`Spent ${spent} of ${round(avail)} available credits${left>0?` (${left} carried over, not scored)`:''}. ${shock?`The “${shock.title}” shock was ${cushionWord(mit)} by ${AREAS.find(a=>a.id===shock.defence).name}. `:''}Growth ${next.growth}% (trend ${P.potential}%), inflation ${next.inflation}%, score ${sb} → ${sn}.`;
 return {stats:next,assets,history:{priorStats:before,priorAssets:p.assets||{},allocation:alloc,available:round(avail),tradeNet:net,dealTrade,before:sb,score:sn,delta:change,spent,newCredits,mitigation:round2(mit),uncertainty:unc,note}}}

// ───────── allocation optimiser (used by the expert report) ─────────
// Greedy on whole credits followed by pairwise refinement; evalFn(alloc) → {objective}.
function optimise(evalFn,keys,limit){

 while(left>0){let best=null;for(const k of keys){let s=Math.min(step,left),a={...alloc,[k]:alloc[k]+s},e=evalFn(a);visited++;if(!best||e.objective>best.e.objective)best={k,s,e}}if(!best||best.e.objective<=cur.objective+1e-9)break;alloc[best.k]+=best.s;left-=best.s;cur=best.e}
 for(const s of [10,5,2,1]){let improved=true,guard=0;while(improved&&guard++<60){improved=false;
  for(const i of keys){if(alloc[i]<s)continue;for(const j of [...keys,null]){if(i===j)continue;let a={...alloc,[i]:alloc[i]-s};if(j)a[j]+=s;let e=evalFn(a);visited++;if(e.objective>cur.objective+1e-9){alloc=a;cur=e;improved=true;break}}}
  if(sum(alloc)+s<=limit)for(const k of keys){let a={...alloc,[k]:alloc[k]+s},e=evalFn(a);visited++;if(e.objective>cur.objective+1e-9){alloc=a;cur=e;improved=true}}}}
 return {best:cur,alloc,visited}}

function outcomeWords(you,expert,code){let a=scoreParts(expert,code),o=scoreParts(you,code),lab={growth:'GDP vs trend',prices:'price stability',fiscal:'fiscal strength',wellbeing:'wellbeing',trade:'trade strength'};let parts=Object.keys(a).map(k=>({k,d:a[k]-o[k]})).filter(x=>Math.abs(x.d)>=1).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,3).map(x=>`${Math.abs(x.d)>=10?'much ':Math.abs(x.d)<3?'slightly ':''}${x.d>0?'better':'worse'} on ${lab[x.k]}`);if(!parts.length)return 'Both mixes lead to almost the same outcome.';return 'The expert’s mix would have done '+(parts.length>1?parts.slice(0,-1).join(', ')+' and '+parts[parts.length-1]:parts[0])+'.'}

function areaAdvice(ctx,A){let {selected,best,code,r}=ctx,you=selected[A.id]||0,exp=best.alloc[A.id]||0,dir=direction(you,exp),sh=shockFor(code,r),def=sh?.defence===A.id,text,gainers=AREAS.filter(B=>direction(selected[B.id]||0,best.alloc[B.id]||0)[2]==='more').map(B=>B.name);

 else if(dir[2]==='same')text='Your funding here was about right.';

 return `<div class="advice"><b>${A.icon} ${esc(A.name)}</b> <span class="badge ${dir[2]==='more'?'strong':dir[2]==='less'?'weak':''}">${dir[0]} expert: ${dir[1]}</span><p>${esc(text)}</p></div>`}

W.prices} × inflation outside your target band (per round) + ${W.fiscal} × fiscal change + ${W.wellbeing} × wellbeing change + ${W.trade} × trade change (+${MISSION_BONUS} for a completed mission at the end). Credits in the treasury are worth nothing.</p><p><b>Fair comparison:</b> the expert faced the same starting economy, the same accepted trades, the same historical shock and the same global conditions. Only the budget changed, not what rival nations might have done in response.</p></div><p class="tiny">Educational simplification: the expert looks ahead only one round. Effects are game mechanics, not economic forecasts.</p></section>`;expertCache.set(key,html);return html}

 let total=draftTotal(),limit=Math.floor(available(uid)),code=me.countryCode,P=profile(code),sh=shockFor(code,r);return `<div class="panel c7"><div class="row between"><div><div class="micro">THE CABINET ROOM</div><h2>Allocate your national budget</h2></div><span class="pill">NO SPENDING CAP</span></div><p class="sub">You get <b>${ROUND_CREDITS} new credits every round</b>. Put any whole number of credits into each of the four areas, up to everything you have. Each extra credit in the same area does a little less than the one before, so spreading usually beats going all-in. Unspent credits carry over but never count towards your score.</p><div class="note"><div class="row between"><b>Allocated budget</b><b id="budget-total" class="${total>limit?'danger':'good'}">${total} / ${limit} credits</b></div><div class="bar" style="margin:10px 0"><i id="budget-progress" style="width:${Math.min(100,limit?total/limit*100:0)}%"></i></div><div class="tiny" id="budget-remaining">${remainingText(total,limit)}</div></div>${AREAS.map(A=>{let v=Number(draft[A.id]||0),m=P.mult[A.id],def=sh?.defence===A.id,ms=Object.values(P.mult),kind=m===Math.max(...ms)?'strong':m===Math.min(...ms)?'weak':'';return `<div class="policy ${def?'def':''}"><div class="sliderrow"><b>${A.icon} ${esc(A.name)}</b><span class="row" style="gap:6px">${def?'<span class="badge def">🛡 shock defence</span>':''}${kind?`<span class="badge ${kind}">${kind==='strong'?'💪 strong area':'⚠️ weak area'}</span>`:''}</span></div><p>${esc(A.desc)}</p><p class="tiny">Mainly improves: ${esc(A.main)}${A.watch?` · Watch out: ${esc(A.watch)}`:''}</p><div class="alloc-row"><input class="slider" data-slider="${A.id}" type="range" min="0" max="${Math.max(limit,v)}" step="1" value="${v}" aria-label="${esc(A.name)} credits"><input class="amount" data-amount="${A.id}" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${v}" aria-label="${esc(A.name)} credits (exact)"><span class="tiny">cr</span></div><div class="tin function captureUI(){let a=document.activeElement,f=null;if(a&&a!==document.body&&appEl.contains(a)){let sel=a.id?'#'+CSS.escape(a.id):a.dataset?.amount?`[data-amount="${a.dataset.amount}"]`:a.dataset?.slider?`[data-slider="${a.dataset.slider}"]`:null;if(sel){let s=null,e=null;try{s=a.selectionStart;e=a.selectionEnd}catch(_){}f={sel,s,e}}}return {f,open:[...appEl.querySelectorAll('details[data-k][open]')].map(d=>d.dataset.k)}}

// ───────── actions ─────────
async function submit(){if(!me||phase()!=='decision'||busy)return;if(submitted(uid))return toast('Decision was already submitted.');let limit=Math.floor(available(uid)),alloc={},total=0;for(const A of AREAS){let v=Number(draft[A.id]||0);if(!Number.isInteger(v)||v<0)return toast('Use whole, non-negative numbers of credits.');if(v){alloc[A.id]=v;total+=v}}if(total>limit)return toast(`Allocation exceeds your available ${limit} credits.`);let r=chosen();toast('Submitting strategy to Firebase…');busy=true;try{
  // Locking in is a single write to this nation's own record. Its server timestamp closes trading:
  // any offer from or to this nation that is still unanswered at that moment expires automatically.
  let result=await runTransaction(ref(db,`roomsV2/${room}/players/${uid}/decisions/${r}`),x=>x===null?{alloc,spent:total,at:serverTimestamp()}:undefined,{applyLocally:false});if(!result.committed)return toast('Decision was already submitted.');draft={};toast('Cabinet allocation submitted. Trading is now closed for your nation.')}catch(e){toast('Submission failed: '+e.message)}finally{busy=false}}
function tradeNote(kind,text){tradeMsg={kind,text,round:chosen()};render()}
// Wait until our own write is visible in the synced room data (the write promise and the listener update can arrive in either order).
function waitFor(pred,ms=4000){return new Promise(res=>{let t0=Date.now();(function tick(){if(pred())return res(true);if(Date.now()-t0>ms)return res(false);setTimeout(tick,60)})()})}
function errText(e){let t=(e&&(e.code||e.message))?`${e.message||e.code}`:String(e);return /permission/i.test(t)?t+' — the database rules are blocking this write (see the setup note from the organiser).':t}
async function sendOffer(){if(busy)return;let to=tradeForm.to,credits=Number(tradeForm.credits),p=game?.players?.[to];if(!tradingOpen(uid))return tradeNote('err',closedReason(uid)||'Trading is closed for your nation.');if(!p||to===uid)return tradeNote('err','Choose a partner nation first.');if(!tradingOpen(to))return tradeNote('err',`${p.name} has locked in, so trading with them is closed this round.`);if(!Number.isInteger(credits)||credits<1)return tradeNote('err','Choose a whole number of credits (at least 1).');let av=Math.floor(available(uid));if(credits>av)return tradeNote('err',`You only have ${av} credits available.`);
 let id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);busy=true;tradeNote('info',`Sending ${credits} credits to ${p.name}…`);
 try{await set(ref(db,`roomsV2/${room}/players/${uid}/deals/${id}`),{to,credits,round:chosen(),at:serverTimestamp(),fromCode:me.countryCode,toCode:p.countryCode});tradeForm.credits='';busy=false;tradeNote('ok',`Offer sent to ${p.name}: ${credits} credits are reserved from your treasury until they answer.`)}catch(e){busy=false;tradeNote('err','Could not send the offer: '+errText(e))}}
async function respondOffer(id,reply){if(busy)return;let d=allDeals().find(x=>x.id===id);if(!d||d.to!==uid)return;if(!tradingOpen(uid))return tradeNote('err',closedReason(uid));if(dealStatus(d)!=='pending')return tradeNote('err','That offer is no longer open.');busy=true;
 try{let res=await runTransaction(ref(db,`roomsV2/${room}/players/${uid}/replies/${id}`),x=>x===null?{from:d.from,reply,at:serverTimestamp()}:undefined,{applyLocally:false});if(!res.committed){busy=false;return tradeNote('err','You have already answered this offer.')}let seen=await waitFor(()=>!!game?.players?.[uid]?.replies?.[id]);busy=false;if(!seen)return tradeNote('info','Your answer was sent. It will appear here in a moment.');let st=dealStatus(allDeals().find(x=>x.id===id)||d);if(reply==='accepted'&&st==='accepted')tradeNote('ok',`Accepted: +${d.credits} credits from ${playerName(d.from)} are now in your treasury.`);else if(reply==='declined'&&st==='declined')tradeNote('ok',`Declined: the ${d.credits} credits go back to ${playerName(d.from)}.`);else tradeNote('err',`Too late: the offer had already ${st==='withdrawn'?'been withdrawn':'expired'}.`)}catch(e){busy=false;tradeNote('err','Could not answer the offer: '+errText(e))}}
async function withdrawOffer(id){if(busy)return;let d=allDeals().find(x=>x.id===id);if(!d||d.from!==uid||dealStatus(d)!=='pending')return tradeNote('err','That offer is no longer open.');busy=true;
 try{let res=await runTransaction(ref(db,`roomsV2/${room}/players/${uid}/deals/${id}`),x=>x&&(x.withdrawnAt===undefined||x.withdrawnAt===null)?{...x,withdrawnAt:serverTimestamp()}:undefined,{applyLocally:false});if(res.committed&&!(await waitFor(()=>{let x=game?.players?.[uid]?.deals?.[id];return !!x&&x.withdrawnAt!==undefined&&x.withdrawnAt!==null}))){busy=false;return tradeNote('info','Withdrawal sent. It will appear here in a moment.')}busy=false;let st=dealStatus(allDeals().find(x=>x.id===id)||d);if(res.committed&&st==='withdrawn')tradeNote('ok',`Offer withdrawn: ${d.credits} credits are back in your treasury.`);else tradeNote('err',st==='accepted'?`Too late: ${playerName(d.to)} had already accepted.`:'That offer is no longer open.')}catch(e){busy=false;tradeNote('err','Could not withdraw the offer: '+errText(e))}}
function nextRound(){draft={};tradeForm={to:'',credits:''};runTransaction(ref(db,`roomsV2/${room}`),g=>g&&g.host===uid&&g.phase==='results'?{...g,phase:g.round===5?'finished':'decision',round:Math.min(5,g.round+1)}:undefined)}
async function resolveRound(){if(role!=='host')return;try{let result=await runTransaction(ref(db,`roomsV2/${room}`),g=>{if(!g||g.host!==uid||g.phase!=='decision')return;let r=Number(g.round),players=g.players||{},now=Date.now();
  let deals=roomDeals(g).filter(d=>Number(d.round)===r),status={};for(const d of deals)status[d.id]=dealStatusIn(g,d,{closing:true});
  let accepted=deals.filter(d=>status[d.id]==='accepted').map(d=>({from:d.from,to:d.to,credits:d.credits,round:r,status:'accepted'}));
  let st=settleTrades(accepted,players,r);
  for(const [id,p] of Object.entries(players)){if(!p)continue;let t=st.per[id]||{in:0,out:0,net:0,dealTrade:0,senderTrade:0,receiverTrade:0},x=compute(p,p.decisions?.[r],r,{net:t.net,dealTrade:t.dealTrade},room,id);x.history.trade={in:t.in,out:t.out,senderTrade:t.senderTrade,receiverTrade:t.receiverTrade};p.stats=x.stats;p.assets=x.assets;p.history=p.history||{};p.history[r]=x.history}
